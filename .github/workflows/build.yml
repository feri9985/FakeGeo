name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          unzip -q FakeGeo.zip -d project
          DIR=$(dirname "$(find project -name settings.gradle.kts | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }

      - name: Build
        run: >
          cd "$PROJECT_DIR" && gradle assembleDebug --no-daemon
          -PsimCountry=ae
          -PsimMccMnc=42403
          -PsimOperator=du

      - uses: actions/upload-artifact@v4
        with:
          name: FakeGeo-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
